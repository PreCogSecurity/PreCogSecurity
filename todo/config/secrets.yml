# Be sure to restart your server when you modify this file.

# Your secret key is used for verifying the integrity of signed cookies.
# If you change this key, all old signed cookies will become invalid!

# Make sure the secret is at least 30 characters and all random,
# no regular words or you'll be exposed to dictionary attacks.
# You can use `rake secret` to generate a secure secret key.

# SECURITY: production secrets must never be committed to the repository.
# The production secret_key_base is read from the SECRET_KEY_BASE environment
# variable; if it is not set, Rails refuses to boot (fail-closed). Development
# and test fall back to fixed local-only keys so a fresh clone works out of
# the box without any configuration.
development:
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] || "52750cc6ed83082171ed0364b418431240414530e9849a0107a3e62c92fe65dc917a0560af75cf96bb5a5f234a2efebbabf2cef5498d672030289fca670aec4d" %>

test:
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] || "654ccb1287269e24254cc84a574972197b79f5895402067dd619c7a5d8bb8000eae8c6ec4669316c07326f75d6aea755f44b9bab2961ceeee2add5100691321b" %>

# Do not keep production secrets in the repository,
# instead read values from the environment.
production:
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] %>