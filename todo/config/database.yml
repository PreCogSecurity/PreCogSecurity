# SQLite version 3.x
#   gem install sqlite3
development:
  adapter: sqlite3
  database: db/development.sqlite3
  pool: 5
  timeout: 5000

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  adapter: sqlite3
  database: db/test.sqlite3
  pool: 5
  timeout: 5000

# SECURITY: production configuration is read entirely from the environment so
# no credentials are committed to the repository. If DATABASE_URL is not set
# the application fails to boot (fail-closed) instead of silently using an
# insecure default.
production:
  url: <%= ENV["DATABASE_URL"] %>
  pool: <%= ENV.fetch("DB_POOL", 5) %>
  timeout: 5000